		var post1 = '<h2 class="newsPostH2">Permaculture Design Certificate course offered at Lake Land College</h2>';

			post1 += '<p>Megan Martin will be teaching an 8-week PDC course through Lake Land College’s community programming starting September 28. The link to sign up is on Lake Land College’s website, <a href="https://learn.lakelandcollege.edu/" target="_blank"> https://learn.lakelandcollege.edu/</a>.  Click on the Community Education box and then choose course CBI-0075-001 - Plant With Purpose</p>';

			post1 += '<h2 class="newsPostH2">What Permaculture is:</h2>';

			post1 += '<p>-A whole systems approach that draws on Indigenous wisdom to design garden spaces and built environments, work life, and even personal relationships that honor the three ethics of 1. Earth care, 2. People care, 3. Fair share/parity.<p>';


			post1 += '<h2 class="newsPostH2">Advantages of a Permaculture course include:</h2>';

		var newsPostsArray = [

		var selectedNews = newsPostsArray.length-1;


		// Function to display the Nth news item (starting at zero).
		function setPostN(N) {
			document.getElementById("postDiv").innerHTML = newsPostsArray[N];
			// Set previously button class back to the unselected class.
			var oldButtonID = "buttonID" + selectedNews;
			document.getElementById(oldButtonID).className = "news-button"; // Button is no longer highlighted.
			
			// Set currently selected button to the selected class.
			var buttonID = "buttonID" + N;
			document.getElementById(buttonID).className = "selectedNewsButton"; // Button is highlighted, meaning it is selected.
			selectedNews = N;
		}


		// Display the most recent news item after the page has loaded.	
	    $(document).ready(function() {
	    	$("#newsID").css("background-color", "#800000");
